<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MULTIVERSE — live</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui}
  #stage-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
              transition:right .3s}
  body.panel-open #stage-wrap{right:280px}
  #stage{position:relative;aspect-ratio:16/9;width:100%;max-height:100vh;max-width:177.78vh;
         transition:transform 1.1s cubic-bezier(.7,0,.3,1);transform-origin:0 0}
  .pane{position:absolute;overflow:hidden;box-sizing:border-box;border:1px solid rgba(80,255,160,.25);
        cursor:pointer}
  .pane:hover{border-color:rgba(120,255,190,.8);box-shadow:inset 0 0 30px rgba(80,255,160,.25)}
  .pane video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .pane .label{position:absolute;left:6px;bottom:4px;color:rgba(180,255,210,.7);
               font-size:10px;text-shadow:0 0 4px #000;max-width:90%;white-space:nowrap;
               overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  #shimmer{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;
           background:radial-gradient(ellipse at 30% 20%, rgba(60,255,140,.35), transparent 60%),
                      radial-gradient(ellipse at 75% 80%, rgba(40,220,120,.3), transparent 55%);
           animation:drift 3s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translateY(-2%) scale(1.02)}to{transform:translateY(2%) scale(1.05)}}
  #flash{position:absolute;inset:0;background:#bfffdc;opacity:0;pointer-events:none}
  #hud{position:fixed;top:10px;left:12px;color:rgba(160,255,190,.5);font-size:11px;
       letter-spacing:.2em;text-transform:uppercase}
  #panel{position:fixed;top:0;right:0;bottom:0;width:280px;box-sizing:border-box;
         background:rgba(0,12,6,.82);border-left:1px solid rgba(80,255,160,.2);
         color:#b8ffd4;font:11px/1.5 ui-monospace,Menlo,monospace;padding:12px;
         overflow-y:auto;transition:transform .3s}
  #panel.hidden{transform:translateX(100%)}
  #panel h3{margin:8px 0 4px;font-size:10px;letter-spacing:.15em;
            text-transform:uppercase;color:rgba(160,255,190,.55)}
  #prog{height:6px;background:rgba(80,255,160,.15);border-radius:3px;margin:4px 0 2px}
  #prog i{display:block;height:100%;background:#4dffa0;border-radius:3px;transition:width .5s}
  #proglabel{color:rgba(160,255,190,.6);font-size:10px}
  .nrow{display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis}
  .dot{flex:none;width:7px;height:7px;border-radius:50%;background:#555;align-self:center}
  .dot.rendering{background:#ffc94d;animation:pulse 1s infinite alternate}
  .dot.ready{background:#4dffa0}
  .dot.failed{background:#ff5d5d}
  .dot.queued{background:#7aa}
  @keyframes pulse{from{opacity:.35}to{opacity:1}}
  #log{color:rgba(180,255,210,.55);font-size:10px}
  #log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #paneltoggle{position:fixed;top:8px;right:10px;z-index:10;cursor:pointer;
               color:rgba(160,255,190,.6);font:12px ui-monospace,monospace;
               background:rgba(0,12,6,.6);border:1px solid rgba(80,255,160,.25);
               border-radius:4px;padding:2px 8px;user-select:none}
</style>
</head>
<body>
<div id="stage-wrap"><div id="stage">
  <div id="panes"></div>
  <div id="shimmer"></div>
  <div id="flash"></div>
</div></div>
<div id="hud">multiverse</div>
<div id="paneltoggle">⚙ status</div>
<div id="panel">
  <h3>next fracture</h3>
  <div id="prog"><i style="width:0"></i></div>
  <div id="proglabel">–</div>
  <h3>universes</h3>
  <div id="nodelist"></div>
  <h3>log</h3>
  <div id="log"></div>
</div>
<script>
const run = new URLSearchParams(location.search).get('run');
const MIN_SHOW = 6500;
const stage = document.getElementById('stage');
const panesEl = document.getElementById('panes');
const shimmer = document.getElementById('shimmer');
const flash = document.getElementById('flash');
const hud = document.getElementById('hud');
const panel = document.getElementById('panel');

document.body.classList.add('panel-open');
document.getElementById('paneltoggle').onclick = e => {
  panel.classList.toggle('hidden');
  document.body.classList.toggle('panel-open', !panel.classList.contains('hidden'));
  e.stopPropagation();
};

let manifest = null;
let rootId = null;              // the universe currently framing the stage
let level = 0, levelShownAt = Date.now(), diving = false, dives = 0;
let audioArmed = false;
const videos = new Map();
const prevStatus = new Map();
const logLines = [];
addEventListener('click', () => { audioArmed = true; applyAudio(); });

// Sound follows the selected universe: solo scenes play their native audio.
function applyAudio(){
  const solo = videos.size === 1;
  for (const el of videos.values()){
    el.querySelector('video').muted = !(audioArmed && solo);
  }
}

const childrenOf = id => Object.keys(manifest.nodes)
  .filter(k => manifest.nodes[k].parent === id)
  .sort((a,b) => +a.split('.').pop() - +b.split('.').pop())
  .slice(0, manifest.branches);

function nodesAtLevel(root, d){
  let cur = [root];
  for (let i=0;i<d;i++) cur = cur.flatMap(childrenOf);
  return cur;
}
const isReady = id => manifest.nodes[id]?.status === 'ready';
const allReady = ids => ids.length>0 && ids.every(isReady);

function regionFor(id, root){
  const rel = id===root ? [] : id.slice(root.length+1).split('.');
  let r = {x:0,y:0,w:1,h:1};
  rel.forEach((seg,i)=>{
    const parentId = i===0 ? root : root+'.'+rel.slice(0,i).join('.');
    const k = Math.max(0, childrenOf(parentId).indexOf(root+'.'+rel.slice(0,i+1).join('.')));
    if (i%2===0){ r.w/=2; r.x += k*r.w; } else { r.h/=2; r.y += k*r.h; }
  });
  return r;
}

function showLevel(root, d){
  const ids = nodesAtLevel(root, d).filter(isReady);
  const keep = new Set(ids);
  for (const [id, el] of videos) if (!keep.has(id)){ el.remove(); videos.delete(id); }
  for (const id of ids){
    let el = videos.get(id);
    if (!el){
      el = document.createElement('div'); el.className='pane';
      const v = document.createElement('video');
      v.muted = true; v.autoplay = true; v.loop = true; v.playsInline = true;
      v.src = `../${run}/${manifest.nodes[id].file}`;
      const lab = document.createElement('div'); lab.className='label';
      lab.textContent = manifest.nodes[id].premise || '';
      el.append(v, lab);
      el.onclick = ev => { ev.stopPropagation(); audioArmed = true; selectUniverse(id); };
      panesEl.append(el); videos.set(id, el);
    }
    const r = regionFor(id, root);
    Object.assign(el.style, {left:r.x*100+'%', top:r.y*100+'%', width:r.w*100+'%', height:r.h*100+'%'});
  }
  applyAudio();
}

function doFlash(){ flash.style.transition='none'; flash.style.opacity=.85;
  requestAnimationFrame(()=>{ flash.style.transition='opacity .5s'; flash.style.opacity=0; }); }

function zoomTo(id, then){
  diving = true;
  const r = regionFor(id, rootId);
  stage.style.transform = `scale(${1/r.w}) translate(${-r.x*100}%, ${-r.y*100}%)`;
  setTimeout(()=>{
    stage.style.transition='none'; stage.style.transform='none';
    then();
    requestAnimationFrame(()=>{ stage.style.transition='transform 1.1s cubic-bezier(.7,0,.3,1)'; });
    doFlash(); diving = false;
  }, 1200);
}

// User selects a universe: tell the engine, zoom in, continue from there.
function selectUniverse(id){
  if (diving || id === rootId || !isReady(id)) return;
  fetch('/control', {method:'POST', headers:{'Content-Type':'application/json'},
                     body: JSON.stringify({run, dive_to: id})}).catch(()=>{});
  logLines.unshift(`${new Date().toLocaleTimeString()} you dove into [${id}]`);
  zoomTo(id, ()=>{ rootId = id; level = 0; levelShownAt = Date.now(); dives++;
                   showLevel(rootId, 0); });
}

async function tick(){
  try { manifest = await (await fetch(`../${run}/manifest.json`, {cache:'no-store'})).json(); }
  catch(e){ return; }
  if (!manifest.cycles?.length || diving) return;
  if (rootId === null) rootId = manifest.cycles[0].root;
  const shown = Date.now() - levelShownAt;
  hud.textContent = `multiverse · dive ${dives} · ${2**level} realit${level?'ies':'y'}`
                    + (audioArmed?'':' · click for sound');
  showLevel(rootId, level);
  updatePanel(rootId);

  const over = Math.max(0, shown - manifest.duration*1000);
  shimmer.style.opacity = Math.min(.75, over/25000);

  if (level < manifest.depth){
    const next = nodesAtLevel(rootId, level+1);
    if (shown > MIN_SHOW && allReady(next)){ level++; levelShownAt = Date.now(); doFlash(); }
  } else if (shown > MIN_SHOW){
    // Autopilot dive: follow the engine's committed next cycle.
    const idx = manifest.cycles.findIndex(c => c.root === rootId);
    const cyc = idx >= 0 ? manifest.cycles[idx] : null;
    if (cyc?.dive_to && manifest.cycles[idx+1] && isReady(cyc.dive_to)){
      const target = cyc.dive_to;
      zoomTo(target, ()=>{ rootId = target; level = 0; levelShownAt = Date.now(); dives++;
                           showLevel(rootId, 0); });
    }
  }
}

function updatePanel(root){
  const next = level < manifest.depth ? nodesAtLevel(root, level+1) : [];
  const ready = next.filter(isReady).length;
  const bar = document.querySelector('#prog i');
  const label = document.getElementById('proglabel');
  if (next.length && next.some(id => manifest.nodes[id])){
    bar.style.width = (100*ready/next.length)+'%';
    label.textContent = `${ready}/${next.length} realities ready`;
  } else if (level < manifest.depth){
    bar.style.width = '0%'; label.textContent = 'storyboarding…';
  } else {
    bar.style.width = '100%'; label.textContent = 'click a reality — or autopilot dives soon';
  }
  const prefix = root + '.';
  const rows = Object.keys(manifest.nodes)
    .filter(id => id===root || id.startsWith(prefix)).sort();
  document.getElementById('nodelist').innerHTML = rows.slice(0, 30).map(id => {
    const n = manifest.nodes[id];
    return `<div class="nrow"><span class="dot ${n.status}"></span>`+
           `<b>${id}</b> <span>${(n.premise||'').slice(0,40)}</span></div>`;
  }).join('');
  for (const [id,n] of Object.entries(manifest.nodes)){
    if (prevStatus.get(id) !== n.status){
      if (prevStatus.has(id) || (n.status !== 'ready' || id !== '0'))
        logLines.unshift(`${new Date().toLocaleTimeString()} [${id}] ${n.status}`);
      prevStatus.set(id, n.status);
    }
  }
  logLines.length = Math.min(logLines.length, 40);
  document.getElementById('log').innerHTML = logLines.map(l=>`<div>${l}</div>`).join('');
}

setInterval(tick, 1000); tick();
</script>
</body>
</html>
