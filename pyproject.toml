[project]
name = "multiverse-engine"
version = "0.0.1"
description = "One moment. Infinite realities. Recursively branch a source moment into synchronized counterfactual video universes."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Eliza Huang" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
fal = ["fal-client>=0.5"]

[project.scripts]
multiverse = "multiverse.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multiverse"]

[tool.ruff]
line-length = 100
src = ["src"]
